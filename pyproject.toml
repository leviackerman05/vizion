[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vizion"
version = "0.2.0"
description = "A durable, narrated topic-to-video studio powered by Manim"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1", "pydantic-settings>=2.8,<3",
  "pwdlib[argon2]>=0.3,<1", "email-validator>=2.2,<3",
  "boto3>=1.37,<2", "imageio-ffmpeg>=0.6,<1",
]

[project.optional-dependencies]
render = ["manim==0.19.0", "piper-tts>=1.3,<2; sys_platform == 'linux'"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["services/video"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/video"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["legacy", "apps", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
